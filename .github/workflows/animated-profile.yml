name: Rebuild animated profile

on:
  schedule:
    - cron: "17 3 * * *" # every day, 06:17 in Nairobi
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-animated.mjs", "assets/source/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PROFILE_TOKEN (optional): a token with read:user, so private
      # contributions are counted. Without it, only public ones are.
      - run: node scripts/build-animated.mjs
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animated data
          git diff --cached --quiet || git commit -m "chore: rebuild animated profile"
          git push
