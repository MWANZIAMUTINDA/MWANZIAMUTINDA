<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>CRB Lookup: check before you lend</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="860" height="210" rx="16" fill="url(#bg)"/>
  <rect width="860" height="210" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="859" height="209" rx="15.5" fill="none" stroke="#30363d"/>
  <rect x="0" y="22" width="4" height="40" rx="2" fill="#58a6ff"/>
  <circle cx="46" cy="44" r="20" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="46" y="50" text-anchor="middle" font-size="12" font-weight="800" fill="#58a6ff">CRB</text>
  <text x="78" y="38" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8b949e">NOW · WAKANDI KENYA · JAMII PLATFORM</text>
  <text x="78" y="58" font-size="19" font-weight="800" fill="#f0f6fc">CRB Lookup: check before you lend</text>
  <rect x="720" y="14" width="124" height="20" rx="10" fill="#58a6ff"/>
  <text x="782" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1117">Shipped Oct 2026</text>
  <text x="26" y="98" font-size="13.5" fill="#c9d1d9">Credit-bureau checks for SACCOs, MFIs and chamas. Credit officers run a check inside a loan</text>
  <text x="26" y="118" font-size="13.5" fill="#c9d1d9">application, results expire on a set retention period, every access is audited, and loan</text>
  <text x="26" y="138" font-size="13.5" fill="#c9d1d9">products call it as a system through API keys.</text>
